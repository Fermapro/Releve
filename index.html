<title>Relevé Fermapro</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one column on a tablet, plan-style title block (cartouche) on top of each job, large touch targets for site visits.
   Color: Fermapro blue and rose, neutrals leaning blue. Type: system fonts only so the app stays identical offline; mono for millimetre values. */
:root{
  --bg:#F4F4F8; --surface:#FFFFFF; --ink:#1B2036; --muted:#5B6280; --line:#D9DBE6;
  --primary:#2D3D74; --on-primary:#FFFFFF; --accent:#F06691; --accent-soft:#FCE3EB; --accent-ink:#8E1F4A;
  --ok:#1E7A4F; --warn:#B5530A; --danger:#B3261E; --shadow:0 1px 2px rgba(27,32,54,.08),0 4px 14px rgba(27,32,54,.06);
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12162A; --surface:#1B2140; --ink:#EDEFF8; --muted:#A5ACC8; --line:#2F3762;
  --primary:#A5B6F5; --on-primary:#12162A; --accent:#F06691; --accent-soft:#48203A; --accent-ink:#FFB3CC;
  --ok:#6FD3A0; --warn:#F3A25C; --danger:#FF8F87; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12162A; --surface:#1B2140; --ink:#EDEFF8; --muted:#A5ACC8; --line:#2F3762;
  --primary:#A5B6F5; --on-primary:#12162A; --accent:#F06691; --accent-soft:#48203A; --accent-ink:#FFB3CC;
  --ok:#6FD3A0; --warn:#F3A25C; --danger:#FF8F87; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:880px;margin:0 auto;padding-block:12px 96px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:22px;color:var(--primary)}
.brand i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp{flex:1}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.on{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.back{min-height:44px;padding:0 12px 0 8px;border:0;background:none;color:var(--primary);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.search{width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.card h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.list{display:grid;gap:10px;margin-top:14px}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.job b{font-size:17px}
.job span{color:var(--muted);font-size:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.tag.ok{background:transparent;color:var(--ok);border:1.5px solid var(--ok)}
.tag.warn{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.cartouche{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--primary);border-radius:6px;background:var(--surface);overflow:hidden}
.cartouche div{padding:9px 12px;border-bottom:1px solid var(--line);min-width:0}
.cartouche div:nth-child(odd){border-right:1px solid var(--line)}
.cartouche div:nth-last-child(-n+2){border-bottom:0}
.cartouche small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cartouche span{display:block;font-weight:650;overflow-wrap:anywhere}
.cartouche .head{grid-column:1/-1;background:var(--primary);color:var(--on-primary);border:0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cartouche .head small{color:inherit;opacity:.8}
.room{margin-top:14px}
.room-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.room-h h3{font-size:18px}
.fold{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;text-align:left;min-height:44px}
.fold i{font-style:normal;color:var(--muted);width:14px}
.bilan .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bilan .row1 b{font-size:17px}
.bilan .row1 .muted{font-size:14px;margin-left:auto}
.prod{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:56px}
.rep{font:700 15px var(--mono);background:var(--primary);color:var(--on-primary);border-radius:6px;padding:5px 9px;min-width:44px;text-align:center}
.prod small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.fld{display:block;margin-bottom:16px}
.fld>span.l{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.fld .req{color:var(--accent);margin-left:3px}
.fld.miss>span.l{color:var(--danger)}
.fld.miss{box-shadow:inset 3px 0 0 var(--danger);padding-left:10px;border-radius:6px}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:var(--danger)}
.alert.warn{border-color:var(--warn)}
.alert>div{flex:1;min-width:200px}
.qte{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qte button{min-width:44px;min-height:44px;border:0;background:none;font-size:20px;font-weight:700;color:var(--primary)}
.qte b{min-width:30px;text-align:center;font:700 17px var(--mono)}
.secnav{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin-bottom:4px;background:var(--bg);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{white-space:nowrap;min-height:40px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.secnav button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.more{margin-top:4px}
.other{margin-top:8px;color:var(--muted);border-style:dashed;font-weight:600}
.flds+.more{margin-top:8px}
.secnav .dot{width:7px;height:7px;border-radius:99px;background:var(--danger);display:inline-block}
.secnav button.on .dot{background:var(--on-primary)}
.kbb{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:30}
.txt,.sel{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
textarea.txt{min-height:84px;resize:vertical}
.chips+.txt{margin-top:8px}
.ordl{display:grid;gap:8px;margin-top:4px}
.ordi{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:52px}
.ordi.drag{border-color:var(--accent);background:var(--accent-soft);opacity:.95}
.ordi .h{touch-action:none;cursor:grab;color:var(--muted);font-size:20px;padding:0 4px;min-width:28px;text-align:center}
.ordi b{font:700 15px var(--mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:3px 8px;min-width:28px;text-align:center}
.ordi .t{flex:1;font-weight:600}
.ordi .btn{min-width:44px}
.pbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.pbi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 7px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);-webkit-tap-highlight-color:transparent}
.pbi svg{width:40px;height:56px;display:block}
.pbi span{font-size:12px;font-weight:700;line-height:1.15;text-align:center;color:var(--muted)}
.pbi.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pbi.on span{color:var(--accent-ink)}
.mm{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;max-width:260px}
.mm input{flex:1;min-width:0;border:0;background:none;padding:12px;font:700 24px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mm input:focus{outline:none}
.mm:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mm b{display:flex;align-items:center;padding:0 12px;font:600 14px var(--mono);color:var(--muted);border-left:1.5px dashed var(--line)}
.pl{display:block;color:var(--danger);font-size:13px;font-weight:650;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 18px}
.tog{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:0}
.tog i{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tog.on i{background:var(--accent)}
.tog.on i::after{transform:translateX(18px)}
.media-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.th img{display:block;width:100%;height:110px;object-fit:cover;background:var(--line)}
.th audio{width:100%;display:block;padding:6px}
.th .row{display:flex;gap:4px;padding:4px}
.th .row button{flex:1;min-height:40px;border:0;background:var(--surface);border-radius:6px;font-size:13px;font-weight:650}
.th .row button.d{color:var(--danger)}
.th .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px 0;font-weight:700}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.sticky>div{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center}
.saved{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;text-transform:none;letter-spacing:0;margin-bottom:6px}
.empty .btn{margin:6px}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg p{margin:0 0 14px;white-space:pre-line}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast.act{display:flex;align-items:center;gap:14px}
.toast.act .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);min-height:36px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:99px;z-index:60;font-weight:650;max-width:90vw;text-align:center}
.sk{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sk .sep{width:1px;height:28px;background:var(--line)}
.sk .bar button[disabled]{opacity:.4}
.sk .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sk .wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.dg .dgout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dgnum{display:flex;gap:8px}
.dgd{min-width:52px;min-height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font:700 30px var(--mono);color:var(--ink)}
.dg .wrap{align-items:stretch}
.dg canvas{width:100%;height:100%;touch-action:none}
.skflag{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:5px 12px;opacity:0;transition:opacity .12s}
.skflag.on{opacity:1}
.sk canvas{background:#fff;max-width:100%;max-height:100%;touch-action:none;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line)}
.sw.on{outline-color:var(--accent)}
.rpt{background:#fff;color:#1B2036;border:1px solid var(--line);border-radius:8px;padding:22px}
.rpt h1{font-size:24px;color:#2D3D74}
.rpt .band{height:6px;background:linear-gradient(90deg,#2D3D74 70%,#F06691 70%);margin:10px 0 16px;border-radius:3px}
.rpt h2{font-size:18px;color:#2D3D74;border-bottom:2px solid #F06691;padding-bottom:3px;margin:22px 0 10px}
.rpt h3{font-size:15px;margin:14px 0 6px}
.rpt table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
.rpt td{padding:4px 8px;border-bottom:1px solid #E6E7EF;vertical-align:top}
.rpt td:first-child{width:42%;color:#5B6280}
.rpt .mmv{font-family:var(--mono);font-weight:700}
.rpt .imgs{display:flex;flex-wrap:wrap;gap:8px}
.rpt .imgs img{height:150px;border:1px solid #D9DBE6;border-radius:4px}
.rpt .prodh{break-inside:avoid;page-break-inside:avoid}
.muted{color:var(--muted)}
@media (max-width:520px){.cartouche{grid-template-columns:1fr}.cartouche div:nth-child(odd){border-right:0}.cartouche div:nth-last-child(-n+2){border-bottom:1px solid var(--line)}.cartouche div:last-child{border-bottom:0}}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--ink:#1B2036;--muted:#5B6280;--line:#D9DBE6;color-scheme:light}
  body{padding:0;background:#fff}
  #app{padding:0;max-width:none}
  .noprint,.sticky,.toast{display:none!important}
  .rpt{border:0;padding:0}
}
@media (min-width:1000px){
  #app{max-width:1160px}
  .sticky>div{max-width:1160px}
  .flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 22px;align-items:start}
  .flds>.grid2{grid-column:1/-1;max-width:720px}
  .flds>.fld:has(.pbg),.flds>.fld:has(.ordl){grid-column:1/-1}
  .media .flds{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<script>
'use strict';
/* ---------- Utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');
const fmtDate=d=>{try{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return (m?new Date(+m[1],+m[2]-1,+m[3]):new Date(d)).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}catch(e){return d||''}};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

/* ---------- Stockage local (IndexedDB, repli mémoire) ---------- */
let db=null; const mem={kv:{},media:{}};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('fermapro-releve',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('media')};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
function idbGet(st,k){return new Promise(res=>{if(!db)return res(mem[st][k]);try{const q=db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(st,k,v){return new Promise(res=>{if(!db){mem[st][k]=v;return res()}try{const t=db.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function idbDel(st,k){return new Promise(res=>{if(!db){delete mem[st][k];return res()}try{const t=db.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
const cache=new Map();
async function getMedia(id){if(cache.has(id))return cache.get(id);const m=await idbGet('media',id);if(m){if(cache.size>40)cache.clear();cache.set(id,m)}return m}

  <button class="btn sm" data-w="3">Fin</button><button class="btn sm on" data-w="7">Épais</button>

    for(let i=0;i<strokes.length;i++)paint(strokes[i],i===sel)};

    else for(let i=3;i<p.length;i+=3){cx.lineWidth=(p[i+2]+p[i-1])/2;cx.beginPath();cx.moveTo(p[i-3],p[i-2]);cx.lineTo(p[i],p[i+1]);cx.stroke()}

  const bbox=s=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<s.p.length;i+=3){const r=s.p[i+2]/2;

    if(t.dataset.tool){tool=t.dataset.tool;ov.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b===t));

    else if(t.id==='sk-undo'){const u=undo.pop();if(u){redo.push(clone(strokes));strokes=u;sel=-1;draw();upd()}}

      if(y>0&&!vu[j-W]&&!ink(j-W)){vu[j-W]=1;q.push(j-W)}

    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const a=x+i,c=y+j;if(a<0||c<0||a>=GN||c>=GN)continue;v+=m[c*GN+a]*(i||j?.55:1);n++}

    else for(let i=2;i<s.length;i+=2)g.lineTo(s[i]*sc+ox,s[i+1]*sc+oy);

function splitDigits(strokes){

    .sort((x,y)=>x.a-y.a);
  const gr=[];
  for(const it of items){const g=gr[gr.length-1];
    if(g&&Math.min(g.b,it.b)-Math.max(g.a,it.a)>-6){g.a=Math.min(g.a,it.a);g.b=Math.max(g.b,it.b);g.s.push(it.p)}
    else gr.push({a:it.a,b:it.b,s:[it.p]})}
  return gr}

    cx.strokeStyle='#E3E5EF';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,cv.height*.78);cx.lineTo(cv.width,cv.height*.78);cx.stroke();

  const reco=()=>{res=splitDigits(strokes).map(g=>{const r=readDigit(g.s,5);return r?r.d:null}).filter(d=>d!==null);

async function purgeTrash(){const old=(S.trash||[]).filter(e=>Date.now()-e.t>=TRASH_MS);
  if(!old.length)return;
  for(const e of old){const l=e.kind==='piece'?(e.data.produits||[]):[e.data];

function restaurer(eid){const e=(S.trash||[]).find(x=>x.id===eid);if(!e)return;

    if(!r){r={id:e.roomId||uid(),nom:e.roomNom||'Pièce restaurée',produits:[]};c.pieces.push(r)}

  const remap=async h=>{if(!h||!h.med||!h.med.length)return;const med=[],mk={};
    for(const id of h.med){const m=await getMedia(id),nid=uid();if(m)await idbPut('media',nid,{id:nid,kind:m.kind,data:m.data});med.push(nid);mk[nid]=(h.mk||{})[id]||'photo'}
    h.med=med;h.mk=mk};
  await remap(c.dec);
  for(const r of c.pieces){r.id=uid();for(const p of r.produits){p.id=uid();await remap(p)}}
  return c}

/* ---------- Sauvegarde automatique vers un espace partagé ---------- */
const cfg=()=>(S.cfg=S.cfg||{url:'',cle:'',auto:false,media:true});
let SYNC={on:false,t:null,last:null};
const pendings=()=>cfg().auto?dirtyJobs():[];
async function payload(c){
  const cl=clById(c.clientId);
  return {fermaproReleve:1,envoi:new Date().toISOString(),appareil:S.appareil||'',client:cl,chantier:c,
    media:cfg().media?await jobMedia(c):{}}}
async function sendJob(c){
  const o=cfg();if(!o.url)throw new Error('Aucune adresse de dépôt');
  const body=JSON.stringify(Object.assign(await payload(c),o.cle?{cle:o.cle}:{}));
  const r=await fetch(o.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  if(!r.ok)throw new Error('Réponse '+r.status);
  const t=(await r.text()).slice(0,200);
  if(/"ok"\s*:\s*false|erreur|error/i.test(t))throw new Error(t||'Refusé par le serveur');
  return t}
async function syncNow(manuel){
  const o=cfg();
  if(SYNC.on)return;
  if(!o.url){if(manuel)toast("Indiquez d'abord l'adresse de dépôt");return}
  if(!navigator.onLine){if(manuel)toast('Pas de connexion : la sauvegarde partira dès le retour du réseau');return}
  const list=manuel?dirtyJobs():pendings();
  if(!list.length){if(manuel)toast('Tout est déjà sauvegardé');return}
  SYNC.on=true;if(V.name==='cfg'||V.name==='home')render();
  let ok=0,err=null;
  for(const c of list){
    try{await sendJob(c);c.exp=Date.now();delete c.syncErr;ok++}
    catch(e){err=e.message||'envoi impossible';c.syncErr=err}}
  SYNC.on=false;SYNC.last={t:Date.now(),ok,err};save(true);
  if(manuel)toast(err?'Envoi incomplet : '+err:`${ok} chantier${ok>1?'s':''} envoyé${ok>1?'s':''}`);
  render()}
function syncSoon(){const o=cfg();if(!o.auto||!o.url)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>syncNow(false),30000)}
addEventListener('online',()=>{if(cfg().auto)syncNow(false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cfg().auto)syncNow(false)});
const syncEtat=()=>{const o=cfg();if(!o.url)return 'Non configurée';
  if(!o.auto)return 'Configurée, envoi manuel';

  const n=pendings().length,e=S.chantiers.find(c=>c.syncErr);
  if(e)return 'Dernière tentative en échec : '+e.syncErr;
  return n?`${n} chantier${n>1?'s':''} en attente`:'À jour'+(SYNC.last?` · dernier envoi ${stamp(SYNC.last.t)}`:'')};

/* Classement par glisser-déposer, au doigt comme au stylet. */
let ORD=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.ordl .h');if(!h)return;
  const it=h.closest('.ordi'),li=it.parentElement;e.preventDefault();
  try{h.setPointerCapture(e.pointerId)}catch(err){}
  ORD={it,li,id:e.pointerId};it.classList.add('drag')});
document.addEventListener('pointermove',e=>{
  if(!ORD||e.pointerId!==ORD.id)return;e.preventDefault();
  const y=e.clientY,items=[...ORD.li.children].filter(x=>x!==ORD.it);
  for(const o of items){const r=o.getBoundingClientRect(),m=r.top+r.height/2;
    if(y<m&&o.compareDocumentPosition(ORD.it)&Node.DOCUMENT_POSITION_FOLLOWING){ORD.li.insertBefore(ORD.it,o);break}
    if(y>m&&o.compareDocumentPosition(ORD.it)&Node.DOCUMENT_POSITION_PRECEDING){ORD.li.insertBefore(ORD.it,o.nextSibling);break}}});
const ordEnd=e=>{if(!ORD||(e&&e.pointerId!==ORD.id))return;
  const k=ORD.li.dataset.k,a=[...ORD.li.children].map(x=>x.dataset.v);
  ORD.it.classList.remove('drag');ORD=null;
  const d=curData();if(d&&JSON.stringify(d[k])!==JSON.stringify(a)){d[k]=a;save()}render()};
document.addEventListener('pointerup',ordEnd);document.addEventListener('pointercancel',ordEnd);

     const ch={id:uid(),clientId:cid,adresse:NF.adresse.trim(),cp:NF.cp||'',ville:NF.ville||'',date:NF.date||today(),par:NF.par||'',gps:NF.gps||null,statut:'ouvert',dec:{med:[],mk:{}},pieces:[]};
     Object.assign(ch,Object.fromEntries(CHK.map(k=>[k,NF[k]||''])));S.chantiers.push(ch);save();go({name:'job',chId:ch.id});break}
   case 'colall':{const d=curData();if(!d.couleurTablier){toast("Choisissez d'abord la couleur du tablier");break}d.couleurLame=d.couleurTablier;if(!sansCoul(d))d.couleurCoulisses=d.couleurTablier;if(!sansCoffre(d))d.couleurCoffre=d.couleurTablier;save();render();toast('Couleur appliquée partout');break}
   case 'geo':geoFill();break;
   case 'staff':editStaff();break;
   case 'info':go({name:'info',chId:V.chId});break;
   case 'dec':go({name:'dec',chId:V.chId});break;
   case 'addroom':{const n=await askText('Nom de la pièce',"",ROOMS.filter(r=>!c.pieces.some(x=>x.nom===r)));if(n){c.pieces.push({id:uid(),nom:n,produits:[]});save();render()}break}
   case 'renroom':{const r=c.pieces.find(x=>x.id===id),n=await askText('Nom de la pièce',r.nom);if(n){r.nom=n;save();render()}break}
   case 'delroom':{const r=c.pieces.find(x=>x.id===id);if(await ask(`Supprimer « ${r.nom} » et ses ${r.produits.length} produit(s) ?\n\nRécupérable pendant 24 heures.`,'Supprimer',true)){
     c.pieces=c.pieces.filter(x=>x.id!==id);jeter('piece',c.id,r);render();
     const e=S.trash[S.trash.length-1];toastUndo(`« ${r.nom} » supprimée`,()=>restaurer(e.id))}break}
   case 'addprod':{const r=c.pieces.find(x=>x.id===id);
     const k=await choose('Quel produit ?',[{l:'Fenêtre',kind:'fenetre'},{l:'Porte-fenêtre',kind:'fenetre',pre:{type:['Porte-fenêtre']}},{l:'Volet roulant',kind:'vr'},{l:"Porte d'entrée",kind:'porte'},{l:'Volet battant',kind:'vb'},{l:'Persienne',kind:'pers'},{l:'Store intérieur',kind:'storeInt'},{l:'Store extérieur',kind:'storeExt'},{l:'Autre produit',kind:'autre'}]);
     if(k)newProduct(r,k.kind,k.pre);break}
   case 'prod':go({name:'prod',chId:V.chId,pid:id});break;
   case 'prodDone':go({name:'job',chId:V.chId});break;
   case 'defs':go({name:'defs',chId:V.chId});break;
   case 'hint':S.noHint=true;save(true);render();break;
   case 'addassoc':{const {p,r}=curProd(),d=p.d,kind=b.dataset.kind,key=b.dataset.fk;
     if(d[key]&&!await ask(`${d[key]} existe déjà pour ${p.rep}. En créer un autre ?`,'Créer'))break;
     const pre={lie:p.rep,hauteur:d.hauteur||'',largeur:d.largeur||''};
     if(d.couleurExt)pre.couleurExt=d.couleurExt;if(d.contraintes)pre.contraintes=d.contraintes;
     if((kind==='vb'||kind==='pers')&&d.prof)pre.prof=d.prof;
     const q=newProduct(r,kind,pre);d[key]=q.rep;save();toast(`${q.rep} créé dans ${r.nom}`);break}
   case 'addvr':case 'addmoust':{const {p,r}=curProd(),d=p.d,isVR=a==='addvr',key=isVR?'vrAssocie':'moustAssociee';
     if(d[key]&&!await ask(`${d[key]} existe déjà pour ${p.rep}. En créer un autre ?`,'Créer'))break;
     const pre=isVR?{lie:p.rep}:{nom:'Moustiquaire',lie:p.rep,hauteur:d.hauteur||'',largeur:d.largeur||''};
     if(isVR){if(d.couleurExt)pre.couleurTablier=pre.couleurCoulisses=pre.couleurCoffre=pre.couleurLame=d.couleurExt;if(d.contraintes)pre.contraintes=d.contraintes}
     const q=newProduct(r,isVR?'vr':'autre',pre);d[key]=q.rep;save();toast(`${q.rep} créé dans ${r.nom}`);break}
   case 'qte':{vib();const {p}=curProd();p.d.qte=Math.max(1,qte(p)+(+b.dataset.n));save();render();break}
   case 'dup':{const {p,r}=curProd(),pre=p.rep.replace(/\d+$/,'');const n=nextNum(c,pre);
     const q={id:uid(),kind:p.kind,rep:pre+n,d:JSON.parse(JSON.stringify(p.d)),med:[],mk:{}};delete q.d.notes;delete q.d.qte;r.produits.splice(r.produits.indexOf(p)+1,0,q);save();toast(`Dupliqué en ${q.rep}`);go({name:'prod',chId:V.chId,pid:q.id});break}
   case 'moveprod':case 'dupto':{const {p,r}=curProd();
     const items=c.pieces.filter(x=>x!==r).map(x=>({l:x.nom,r:x}));items.push({l:'+ Nouvelle pièce',nw:1});
     const k=await choose(a==='moveprod'?`Déplacer ${p.rep} vers…`:`Dupliquer ${p.rep} dans…`,items);if(!k)break;
     let t=k.r;if(k.nw){const n=await askText('Nom de la pièce','',ROOMS.filter(x=>!c.pieces.some(y=>y.nom===x)));if(!n)break;t={id:uid(),nom:n,produits:[]};c.pieces.push(t)}
     if(a==='moveprod'){r.produits=r.produits.filter(x=>x!==p);t.produits.push(p);save();toast(`${p.rep} déplacé vers ${t.nom}`);render()}
     else{const pre=p.rep.replace(/\d+$/,''),n=nextNum(c,pre),q={id:uid(),kind:p.kind,rep:pre+n,d:JSON.parse(JSON.stringify(p.d)),med:[],mk:{}};delete q.d.notes;delete q.d.qte;t.produits.push(q);save();toast(`Dupliqué en ${q.rep} dans ${t.nom}`);go({name:'prod',chId:V.chId,pid:q.id})}
     break}
   case 'editrep':{const {p}=curProd(),n=await askText('Repère du produit',p.rep);if(n){p.rep=n;save();render()}break}
   case 'delprod':{const {p,r}=curProd();if(await ask(`Supprimer ${p.rep} ?\n\nRécupérable pendant 24 heures.`,'Supprimer',true)){
     r.produits=r.produits.filter(x=>x!==p);jeter('produit',c.id,p,{roomId:r.id,roomNom:r.nom});go({name:'job',chId:V.chId});
     const e=S.trash[S.trash.length-1];toastUndo(`${p.rep} supprimé`,()=>restaurer(e.id))}break}
   case 'chip':{vib();const d=curData(),k=b.dataset.k;d[k]=d[k]===b.dataset.v?'':b.dataset.v;save();render();break}
   case 'multi':{vib();const d=curData(),k=b.dataset.k,mv=b.dataset.v,a=Array.isArray(d[k])?d[k]:(d[k]?[d[k]]:[]);
     if(a.includes(mv))d[k]=a.filter(x=>x!==mv);
     else{const f=allFields().find(x=>x.k===k&&x.excl),g=f&&(f.excl.find(x=>x.includes(mv))||[]).filter(x=>x!==mv);
       const out=g?a.filter(x=>!g.includes(x)):a;
       if(g&&out.length!==a.length)toast(`${mv} remplace ${a.filter(x=>g.includes(x)).join(', ')}`);
       d[k]=out.concat(mv)}
     save();render();break}
   case 'tog':{vib();const d=curData();d[b.dataset.k]=!d[b.dataset.k];save();render();break}
   case 'photo':addPhotos(true);break;
   case 'gallery':addPhotos(false);break;
   case 'audiofile':addAudioFile();break;
   case 'rec':toggleRec();break;
   case 'newsk':openSketch(curHolder());break;
   case 'editsk':openSketch(curHolder(),id);break;
   case 'annot':{const m=await getMedia(id);if(m)openSketch(curHolder(),null,m.data,id);break}
   case 'delmedia':if(await ask('Supprimer ce média ?','Supprimer',true))delMedia(curHolder(),id);break;
   case 'synth':go({name:'synth',chId:V.chId});break;
   case 'pdf':{toast('Création du PDF…');try{const bytes=await buildSynthPDF(c),cl=clById(c.clientId);await shareOrSave(new Blob([bytes],{type:'application/pdf'}),`releve-${slug(cl&&cl.nom)}-${c.date}.pdf`,'application/pdf')}catch(e){toast('Le PDF n\'a pas pu être créé')}break}
   case 'shareaudio':{const m=await getMedia(id);if(!m)break;const bl=dataToBlob(m.data),t=bl.type||'',ext=/mp4|m4a|aac/.test(t)?'m4a':/mpeg|mp3/.test(t)?'mp3':/webm/.test(t)?'webm':/ogg/.test(t)?'ogg':/wav/.test(t)?'wav':'audio';await shareOrSave(bl,`note-vocale-${slug(clById(c.clientId)&&clById(c.clientId).nom)}-${id.slice(0,6)}.${ext}`,t||'audio/mp4');break}
   case 'print':try{window.print()}catch(e){toast("Impression indisponible dans cet aperçu")}break;
   case 'close':{const m=allMissing(c);if(m.length&&!await ask(`Des champs obligatoires sont vides :\n${m.join('\n')}\n\nClôturer quand même ?`,'Clôturer'))break;c.statut='clos';save();render();if(unsaved(c)&&c.pieces.some(r=>r.produits.length)&&await ask('Chantier clôturé. Enregistrer la sauvegarde maintenant ?','Sauvegarder'))await exportJob(c);break}
   case 'reopen':c.statut='ouvert';save();render();break;
   case 'deljob':if(await ask('Supprimer ce chantier et tous ses médias ? Cette action est définitive.','Supprimer',true)){for(const r of c.pieces)for(const p of r.produits)for(const m of p.med||[])await idbDel('media',m);for(const m of c.dec.med||[])await idbDel('media',m);S.chantiers=S.chantiers.filter(x=>x!==c);save();go({name:'home'})}break;
   case 'exportjob':exportJob(c);break;
   case 'exportcsv':exportCSV(c);break;
   case 'exportall':exportAll();break;
   case 'restaurer':restaurer(id);break;
   case 'copycotes':{const {p}=curProd(),q=c.pieces.flatMap(r=>r.produits).find(x=>x.id===id);
     if(!q)break;for(const k of ['modeCote','hauteur','largeur','prof'])if(q.d[k]&&!p.d[k])p.d[k]=q.d[k];
     save();render();toast(`Cotes de ${q.rep} reprises`);break}
   case 'cfg':go({name:'cfg'});break;
   case 'setdate':{NF.date=dayShift(+b.dataset.v);render();break}
   case 'liste':editListe(id);break;
   case 'theme':{const o=['auto','light','dark'];S.theme=o[(o.indexOf(S.theme||'auto')+1)%3];applyTheme();save(true);render();break}
   case 'ordmv':{const d=curData(),k=b.dataset.k,a=(d[k]||[]).slice(),i=a.indexOf(b.dataset.v),j=i+(+b.dataset.d);
     if(i<0||j<0||j>=a.length)break;a.splice(j,0,a.splice(i,1)[0]);d[k]=a;save();render();break}
   case 'cfgtog':{const o=cfg();o[b.dataset.k]=!o[b.dataset.k];save(true);render();if(o.auto&&o.url)syncNow(false);break}
   case 'syncnow':syncNow(true);break;
   case 'synctest':{const o=cfg();if(!o.url){toast("Indiquez d'abord l'adresse de dépôt");break}
     toast('Test en cours…');
     try{const r=await fetch(o.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fermaproReleve:1,test:true,cle:o.cle||''})});
       toast(r.ok?'Adresse joignable, réponse '+r.status:'Réponse '+r.status+' : vérifiez le partage du script')}
     catch(e){toast("Adresse injoignable : vérifiez l'URL et la connexion")}break}
   case 'fold':JV.col[id]=!JV.col[id];render();break;
   case 'foldall':{const t=!c.pieces.every(r=>JV.col[r.id]);for(const r of c.pieces)JV.col[r.id]=t;render();break}
   case 'filt':JV.filt=JV.filt===id?'':id;render();break;
   case 'other':{V.other=V.other||{};V.other[b.dataset.k]=1;render();const i=app.querySelector(`input[data-k="${b.dataset.k}"]`);if(i)i.focus();break}
   case 'more':{V.more=V.more||{};V.more[id]=!V.more[id];render();break}
   case 'gosec':{const t=document.getElementById(id);if(t)scrollTo({top:Math.max(0,t.offsetTop-64),behavior:'smooth'});break}
   case 'gomiss':{const t=app.querySelector('.fld.miss');if(t){t.scrollIntoView({block:'center',behavior:'smooth'});const i=t.querySelector('input,textarea,select');if(i&&i.dataset.t==='mm')setTimeout(()=>i.focus(),320)}break}
   case 'import':importJob();break;
  }
});
function staffOpts(cur){const l=S.staff.slice();if(cur&&!l.includes(cur))l.push(cur);return `<option value="">Choisir…</option>`+l.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('')}
function editStaff(){
  const o=document.createElement('div');o.className='ov';
  const draw=()=>{o.innerHTML=`<div class="dlg" role="dialog"><p><b>Personnes qui réalisent les relevés</b></p><div class="list" style="margin:0 0 12px">${S.staff.map((n,i)=>`<div style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(n)}</span><button class="btn sm dng" data-del="${i}">Retirer</button></div>`).join('')||'<span class="muted">Liste vide</span>'}</div><div style="display:flex;gap:8px;margin-bottom:14px"><input class="txt" id="stin" placeholder="Ajouter un prénom"><button class="btn pri" data-add="1">Ajouter</button></div><div class="acts"><button class="btn" data-ok="1">Fermer</button></div></div>`};
  draw();
  o.onclick=e=>{const b=e.target.closest('button');
    if(e.target===o||(b&&b.dataset.ok)){o.remove();save();if(V.name==='new'||V.name==='job'||V.name==='home')render();return}
    if(b&&b.dataset.del!==undefined){S.staff.splice(+b.dataset.del,1);save();draw()}
    else if(b&&b.dataset.add){const v=$('#stin',o).value.trim();if(v&&!S.staff.includes(v)){S.staff.push(v);save()}draw();const i=$('#stin',o);if(i)i.focus()}};
  document.body.appendChild(o);
}
function geoFill(){
  if(!navigator.geolocation)return toast('Localisation indisponible sur cet appareil');
  const b=$('#geobtn');if(b){b.disabled=true;b.textContent='Localisation en cours…'}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lon=pos.coords.longitude;NF.gps={lat:+lat.toFixed(6),lon:+lon.toFixed(6)};
    try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${lon}&lat=${lat}`,{signal:ctl.signal});clearTimeout(t);
      const j=await r.json(),p=j.features&&j.features[0]&&j.features[0].properties;
      if(!p)throw 0;NF.adresse=p.name||'';NF.cp=p.postcode||'';NF.ville=p.city||'';toast("Adresse trouvée : vérifiez le numéro de la rue");
    }catch(e){toast("Adresse introuvable (pas de connexion ?). Position GPS enregistrée, complétez l'adresse.")}
    if(V.name==='new')render();
  },err=>{toast(err&&err.code===1?'Localisation refusée : autorisez-la dans les réglages':'Position introuvable');if(V.name==='new')render()},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
async function exportJob(c){
  const old=c.exp;c.exp=Date.now();
  const media=await jobMedia(c);
  const cl=clById(c.clientId),name=`releve-${(cl&&cl.nom||'client').replace(/[^\w]+/g,'-')}-${c.date}.json`,
    blob=new Blob([JSON.stringify({fermaproReleve:1,client:cl,chantier:c,media})],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Relevé '+(cl&&cl.nom||'')});save(true);toast('Sauvegarde envoyée');render();return}
  }catch(e){if(e&&e.name==='AbortError'){c.exp=old;return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  save(true);toast('Sauvegarde générée : enregistrez ou déplacez le fichier');render();
}
async function importJob(){
  const [f]=await pickFile('.json,application/json','',false);if(!f)return;
  let o;try{o=JSON.parse(await f.text());if(!o.fermaproReleve)throw 0}catch(e){return toast('Fichier de sauvegarde non reconnu')}
  const lots=Array.isArray(o.chantiers)?o.chantiers:(o.chantier?[o.chantier]:[]);
  if(!lots.length)return toast('Fichier de sauvegarde non reconnu');
  const cls=Array.isArray(o.clients)?o.clients:(o.client?[o.client]:[]);
  for(const cl of cls)if(cl&&cl.id&&!clById(cl.id))S.clients.push(cl);
  for(const m of Object.values(o.media||{}))await idbPut('media',m.id,m);
  let last=null,n=0;
  for(const ch of lots){
    const i=S.chantiers.findIndex(x=>x.id===ch.id);
    if(i<0){S.chantiers.push(ch);last=ch;n++;continue}
    const ex=S.chantiers[i],nom=(clById(ex.clientId)||{}).nom||ex.adresse||'Ce chantier';
    const k=await choose(`« ${nom} » existe déjà sur cette tablette.`,[
      {l:`Remplacer — tablette : ${stamp(ex.mod)}, fichier : ${stamp(ch.mod)}`,v:'rep'},
      {l:'Importer en double, sans toucher à celui de la tablette',v:'dup'},
      {l:'Ne pas importer ce chantier',v:'skip'}]);
    if(!k||k.v==='skip')continue;
    if(k.v==='rep'){S.chantiers[i]=ch;last=ch;n++}
    else{const cp=await dupJob(ch);S.chantiers.push(cp);last=cp;n++}}
  if(!n)return toast("Aucun chantier n'a été importé");
  save();toast(n>1?`${n} chantiers importés`:'Chantier importé');go({name:'job',chId:last.id})
}
(async()=>{await openDB();const s=await idbGet('kv','state');if(s&&s.chantiers)S=s;migrate();purgeTrash();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(!Array.isArray(S.staff))S.staff=['Julien','Allan','Anthony','Christophe'];
  applyTheme();applyListes();
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  render(false)})();
</script>
